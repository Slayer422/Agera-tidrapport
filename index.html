<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Agera – Tidrapport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            agera: {
              dark: '#0f1419',
              card: '#1a222d',
              border: '#2a3544',
              green: '#4ade80',
              greenDark: '#22c55e',
              orange: '#f97316',
              muted: '#94a3b8'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-agera-dark text-white min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative"></div>

  <script>
    // ========== DATA ==========
    const STORAGE_KEY = 'agera_tidrapport_v1';

    const defaultProjects = [
      { id: 'p1', name: 'P2480-4 – PEAB Kustkajen SITE Pipe', code: 'P2480-4' },
      { id: 'p2', name: 'Agera HQ – Intern', code: 'HQ' },
      { id: 'p3', name: 'Säkerhetsutbildning – Kund X', code: 'SU-01' },
      { id: 'p4', name: 'Industriskydd – Fabrik Y', code: 'IS-12' }
    ];

    const timeTypes = [
      { id: 'ord', label: 'Ordinarie tid', short: 'Ord.' },
      { id: 'ob1', label: 'OB1', short: 'OB1' },
      { id: 'ob2', label: 'OB2', short: 'OB2' },
      { id: 'helg', label: 'Helg', short: 'Helg' }
    ];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { reports: [], projects: defaultProjects };
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let state = {
      view: 'home', // home | register | overview | projects | menu
      selectedDate: new Date().toISOString().slice(0, 10),
      data: loadData(),
      // register form
      form: {
        projectId: '',
        entries: [{ type: 'ord', hours: '' }],
        mileage: '',
        perDiem: false,
        comment: ''
      }
    };

    // ========== HELPERS ==========
    function formatDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      const days = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
      const months = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
      return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
    }

    function formatFullDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      const days = ['Söndag', 'Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag'];
      const months = ['januari', 'februari', 'mars', 'april', 'maj', 'juni', 'juli', 'augusti', 'september', 'oktober', 'november', 'december'];
      return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function changeDate(delta) {
      const d = new Date(state.selectedDate + 'T12:00:00');
      d.setDate(d.getDate() + delta);
      state.selectedDate = d.toISOString().slice(0, 10);
      render();
    }

    function getDayHours(date) {
      return state.data.reports
        .filter(r => r.date === date)
        .reduce((sum, r) => sum + r.entries.reduce((s, e) => s + (parseFloat(e.hours) || 0), 0), 0);
    }

    function getWeekHours(date) {
      const d = new Date(date + 'T12:00:00');
      const day = d.getDay() || 7; // Monday = 1
      const monday = new Date(d);
      monday.setDate(d.getDate() - day + 1);
      let total = 0;
      for (let i = 0; i < 7; i++) {
        const dd = new Date(monday);
        dd.setDate(monday.getDate() + i);
        total += getDayHours(dd.toISOString().slice(0, 10));
      }
      return total;
    }

    function getProjectName(id) {
      const p = state.data.projects.find(x => x.id === id);
      return p ? p.name : 'Okänt projekt';
    }

    // ========== RENDER ==========
    function render() {
      const app = document.getElementById('app');
      if (state.view === 'home') app.innerHTML = renderHome();
      else if (state.view === 'register') app.innerHTML = renderRegister();
      else if (state.view === 'overview') app.innerHTML = renderOverview();
      else if (state.view === 'projects') app.innerHTML = renderProjects();
      else if (state.view === 'menu') app.innerHTML = renderMenu();
      bindEvents();
    }

    function renderHome() {
      const dayH = getDayHours(state.selectedDate);
      const weekH = getWeekHours(state.selectedDate);
      const dayReports = state.data.reports.filter(r => r.date === state.selectedDate);

      return `
        <div class="flex-1 flex flex-col pb-24">
          <!-- Header -->
          <div class="px-4 pt-4 pb-3 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-agera-card flex items-center justify-center text-agera-green font-bold text-lg">A</div>
            <div>
              <div class="font-semibold text-base">Agera Industrial Safety</div>
              <div class="text-agera-muted text-sm">Demo-användare</div>
            </div>
          </div>

          <!-- Date nav -->
          <div class="mx-4 mb-3 flex items-center bg-agera-card rounded-2xl overflow-hidden">
            <button data-action="prev-day" class="px-4 py-3 text-agera-green text-xl font-light">‹</button>
            <div class="flex-1 text-center py-3 font-medium text-sm">${formatFullDate(state.selectedDate)}</div>
            <button data-action="next-day" class="px-4 py-3 text-agera-green text-xl font-light">›</button>
            <button data-action="today" class="px-3 py-3 text-agera-green">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/></svg>
            </button>
          </div>

          <!-- Totals -->
          <div class="mx-4 mb-5 bg-agera-card rounded-2xl px-4 py-3 flex justify-between items-center">
            <span class="text-agera-muted text-sm">Total:</span>
            <div class="text-sm font-medium">
              <span class="text-white">${dayH}h dag</span>
              <span class="text-agera-muted mx-1">|</span>
              <span class="text-agera-green">${weekH}h vecka</span>
            </div>
          </div>

          <!-- Day reports -->
          ${dayReports.length > 0 ? `
            <div class="mx-4 mb-4 space-y-2">
              ${dayReports.map(r => `
                <div class="bg-agera-card rounded-2xl p-4 border-l-4 border-agera-green">
                  <div class="font-medium text-sm mb-1 truncate">${getProjectName(r.projectId)}</div>
                  ${r.entries.map(e => {
                    const t = timeTypes.find(x => x.id === e.type);
                    return `<div class="text-agera-muted text-xs flex justify-between"><span>${t ? t.label : e.type}</span><span class="text-white">${e.hours}h</span></div>`;
                  }).join('')}
                  ${r.mileage ? `<div class="text-agera-muted text-xs mt-1">Milersättning: ${r.mileage} km</div>` : ''}
                  ${r.perDiem ? `<div class="text-agera-muted text-xs">Traktamente: Ja</div>` : ''}
                </div>
              `).join('')}
            </div>
          ` : ''}

          <!-- Favorites -->
          <div class="px-4">
            <h2 class="text-base font-semibold mb-3">Mina favoriter</h2>
            <div class="grid grid-cols-3 gap-3">
              <button data-action="go-register" class="bg-agera-card rounded-2xl p-4 flex flex-col items-center gap-2 active:scale-95 transition">
                <div class="w-10 h-10 rounded-full bg-agera-green/10 flex items-center justify-center">
                  <svg class="w-5 h-5 text-agera-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M12 6v6l4 2" stroke-width="2" stroke-linecap="round"/></svg>
                </div>
                <span class="text-xs text-center">Tid & material</span>
              </button>
              <button class="bg-agera-card rounded-2xl p-4 flex flex-col items-center gap-2 opacity-50">
                <div class="w-10 h-10 rounded-full bg-agera-green/10 flex items-center justify-center">
                  <svg class="w-5 h-5 text-agera-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707" stroke-width="2"/></svg>
                </div>
                <span class="text-xs text-center">Frånvaro</span>
              </button>
              <button class="bg-agera-card rounded-2xl p-4 flex flex-col items-center gap-2 opacity-50">
                <div class="w-10 h-10 rounded-full bg-agera-green/10 flex items-center justify-center">
                  <svg class="w-5 h-5 text-agera-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="2"/><path d="M12 8v8m-4-4h8" stroke-width="2"/></svg>
                </div>
                <span class="text-xs text-center">Ersättning</span>
              </button>
            </div>
          </div>
        </div>

        ${renderBottomNav('home')}
      `;
    }

    function renderRegister() {
      const form = state.form;
      return `
        <div class="flex-1 flex flex-col pb-8">
          <!-- Header -->
          <div class="px-4 pt-4 pb-3 flex items-center justify-between sticky top-0 bg-agera-dark z-10">
            <button data-action="go-home" class="text-agera-green text-2xl font-light">‹</button>
            <h1 class="font-semibold text-base">Registrera tid</h1>
            <button data-action="save-report" class="bg-agera-green text-agera-dark font-semibold text-sm px-4 py-1.5 rounded-full">Spara</button>
          </div>

          <div class="px-4 space-y-4 fade-in">
            <!-- Date -->
            <div class="text-center text-agera-muted text-sm">${formatFullDate(state.selectedDate)}</div>

            <!-- Project select -->
            <div>
              <label class="text-xs text-agera-muted mb-1 block">Projekt</label>
              <select id="project-select" class="w-full bg-agera-card border border-agera-border rounded-2xl px-4 py-3 text-sm appearance-none focus:outline-none focus:border-agera-green">
                <option value="">Välj projekt...</option>
                ${state.data.projects.map(p => `<option value="${p.id}" ${form.projectId === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
              </select>
            </div>

            <!-- Time entries -->
            <div class="space-y-3">
              <div class="text-xs text-agera-muted">Tidtyper</div>
              ${form.entries.map((entry, idx) => `
                <div class="bg-agera-card rounded-2xl p-4 space-y-3">
                  <div class="flex gap-2">
                    ${timeTypes.map(t => `
                      <button data-action="set-type" data-idx="${idx}" data-type="${t.id}"
                        class="flex-1 py-2 rounded-xl text-xs font-medium transition
                          ${entry.type === t.id ? 'bg-agera-green text-agera-dark' : 'bg-agera-dark text-agera-muted border border-agera-border'}">
                        ${t.short}
                      </button>
                    `).join('')}
                  </div>
                  <div class="flex items-center gap-3">
                    <label class="text-sm text-agera-muted w-20">Timmar</label>
                    <input type="number" inputmode="decimal" step="0.5" min="0" max="24"
                      data-action="set-hours" data-idx="${idx}"
                      value="${entry.hours}"
                      placeholder="0"
                      class="flex-1 bg-agera-dark border border-agera-border rounded-xl px-4 py-2.5 text-sm text-right focus:outline-none focus:border-agera-green" />
                  </div>
                  ${form.entries.length > 1 ? `<button data-action="remove-entry" data-idx="${idx}" class="text-red-400 text-xs">Ta bort</button>` : ''}
                </div>
              `).join('')}
              <button data-action="add-entry" class="w-full py-3 text-agera-green text-sm font-medium flex items-center justify-center gap-1">
                <span class="text-lg">+</span> Lägg till fler tidtyper
              </button>
            </div>

            <!-- Mileage & Per diem -->
            <div class="bg-agera-card rounded-2xl p-4 space-y-4">
              <div class="flex items-center gap-3">
                <label class="text-sm text-agera-muted flex-1">Milersättning (km)</label>
                <input type="number" inputmode="decimal" id="mileage-input" value="${form.mileage}" placeholder="0"
                  class="w-24 bg-agera-dark border border-agera-border rounded-xl px-3 py-2 text-sm text-right focus:outline-none focus:border-agera-green" />
              </div>
              <div class="flex items-center justify-between">
                <label class="text-sm text-agera-muted">Traktamente</label>
                <button data-action="toggle-perdiem" class="w-12 h-7 rounded-full transition relative ${form.perDiem ? 'bg-agera-green' : 'bg-agera-border'}">
                  <span class="absolute top-0.5 w-6 h-6 bg-white rounded-full transition ${form.perDiem ? 'left-5' : 'left-0.5'}"></span>
                </button>
              </div>
            </div>

            <!-- Comment -->
            <div>
              <label class="text-xs text-agera-muted mb-1 block">Kommentar (valfritt)</label>
              <textarea id="comment-input" rows="2" placeholder="Anteckning..."
                class="w-full bg-agera-card border border-agera-border rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-agera-green resize-none">${form.comment}</textarea>
            </div>
          </div>
        </div>
      `;
    }

    function renderOverview() {
      // Group by date, last 14 days
      const dates = [];
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        dates.push(d.toISOString().slice(0, 10));
      }

      return `
        <div class="flex-1 flex flex-col pb-24">
          <div class="px-4 pt-4 pb-3 flex items-center gap-3">
            <button data-action="go-home" class="text-agera-green text-2xl font-light">‹</button>
            <h1 class="font-semibold text-base">Översikt</h1>
          </div>

          <div class="mx-4 mb-4 bg-agera-card rounded-2xl px-4 py-3 flex justify-between">
            <div>
              <div class="text-xs text-agera-muted">Arbetad tid (14 dagar)</div>
              <div class="text-xl font-semibold text-agera-green">${dates.reduce((s, d) => s + getDayHours(d), 0)}h</div>
            </div>
          </div>

          <div class="px-4 space-y-2">
            ${dates.map(date => {
              const reports = state.data.reports.filter(r => r.date === date);
              const hours = getDayHours(date);
              if (hours === 0 && reports.length === 0) return '';
              return `
                <div class="bg-agera-card rounded-2xl p-4">
                  <div class="flex justify-between items-center mb-2">
                    <span class="font-medium text-sm">${formatDate(date)}</span>
                    <span class="text-agera-green font-semibold">${hours}h</span>
                  </div>
                  ${reports.map(r => `
                    <div class="text-xs text-agera-muted truncate">${getProjectName(r.projectId)}</div>
                  `).join('')}
                </div>
              `;
            }).join('') || '<div class="text-center text-agera-muted py-8">Inga rapporter ännu</div>'}
          </div>
        </div>
        ${renderBottomNav('overview')}
      `;
    }

    function renderProjects() {
      return `
        <div class="flex-1 flex flex-col pb-24">
          <div class="px-4 pt-4 pb-3 flex items-center gap-3">
            <button data-action="go-home" class="text-agera-green text-2xl font-light">‹</button>
            <h1 class="font-semibold text-base">Projekt</h1>
          </div>
          <div class="px-4 space-y-2">
            ${state.data.projects.map(p => `
              <div class="bg-agera-card rounded-2xl p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-agera-green/10 flex items-center justify-center text-agera-green text-sm font-bold">${p.code.slice(0,2)}</div>
                <div class="flex-1 min-w-0">
                  <div class="font-medium text-sm truncate">${p.name}</div>
                  <div class="text-xs text-agera-muted">${p.code}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        ${renderBottomNav('projects')}
      `;
    }

    function renderMenu() {
      return `
        <div class="flex-1 flex flex-col pb-24">
          <div class="px-4 pt-4 pb-3 flex items-center justify-between">
            <h1 class="font-semibold text-base">Meny</h1>
            <button data-action="go-home" class="text-agera-muted text-xl">✕</button>
          </div>

          <div class="px-4 space-y-1">
            <div class="text-xs text-agera-muted uppercase tracking-wider px-2 py-2">Mitt arbete</div>
            <button data-action="go-projects" class="w-full flex items-center gap-3 px-3 py-3.5 rounded-xl hover:bg-agera-card">
              <span class="text-agera-green">📁</span> <span>Projekt</span>
            </button>
            <button data-action="go-overview" class="w-full flex items-center gap-3 px-3 py-3.5 rounded-xl hover:bg-agera-card">
              <span class="text-agera-green">📅</span> <span>Översikt</span>
            </button>

            <div class="text-xs text-agera-muted uppercase tracking-wider px-2 py-2 mt-4">Skapa</div>
            <button data-action="go-register" class="w-full flex items-center gap-3 px-3 py-3.5 rounded-xl hover:bg-agera-card">
              <span class="text-agera-green">⏱</span> <span>Tid & material</span>
            </button>

            <div class="text-xs text-agera-muted uppercase tracking-wider px-2 py-2 mt-4">Demo</div>
            <button data-action="clear-data" class="w-full flex items-center gap-3 px-3 py-3.5 rounded-xl text-red-400 hover:bg-agera-card">
              <span>🗑</span> <span>Rensa all data (demo)</span>
            </button>
          </div>
        </div>
        ${renderBottomNav('menu')}
      `;
    }

    function renderBottomNav(active) {
      return `
        <div class="fixed bottom-0 left-0 right-0 bg-agera-card border-t border-agera-border safe-bottom">
          <div class="max-w-md mx-auto flex justify-around items-center py-2">
            <button data-action="go-home" class="flex flex-col items-center gap-0.5 px-4 py-1 ${active === 'home' ? 'text-agera-green' : 'text-agera-muted'}">
              <svg class="w-6 h-6" fill="${active === 'home' ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" stroke-width="2"/></svg>
              <span class="text-[10px]">Hem</span>
            </button>
            <button data-action="go-register" class="flex flex-col items-center gap-0.5 px-4 py-1 ${active === 'register' ? 'text-agera-green' : 'text-agera-muted'}">
              <div class="w-10 h-10 -mt-4 rounded-full bg-agera-green text-agera-dark flex items-center justify-center text-2xl font-light shadow-lg">+</div>
              <span class="text-[10px] mt-0.5">Skapa</span>
            </button>
            <button data-action="go-menu" class="flex flex-col items-center gap-0.5 px-4 py-1 ${active === 'menu' ? 'text-agera-green' : 'text-agera-muted'}">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-width="2" stroke-linecap="round"/></svg>
              <span class="text-[10px]">Meny</span>
            </button>
          </div>
        </div>
      `;
    }

    // ========== EVENTS ==========
    function bindEvents() {
      document.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', (e) => {
          const action = el.dataset.action;
          const idx = el.dataset.idx !== undefined ? parseInt(el.dataset.idx) : null;

          if (action === 'go-home') { state.view = 'home'; render(); }
          else if (action === 'go-register') {
            state.view = 'register';
            state.form = { projectId: '', entries: [{ type: 'ord', hours: '' }], mileage: '', perDiem: false, comment: '' };
            render();
          }
          else if (action === 'go-overview') { state.view = 'overview'; render(); }
          else if (action === 'go-projects') { state.view = 'projects'; render(); }
          else if (action === 'go-menu') { state.view = 'menu'; render(); }
          else if (action === 'prev-day') changeDate(-1);
          else if (action === 'next-day') changeDate(1);
          else if (action === 'today') {
            state.selectedDate = new Date().toISOString().slice(0, 10);
            render();
          }
          else if (action === 'set-type') {
            state.form.entries[idx].type = el.dataset.type;
            render();
          }
          else if (action === 'add-entry') {
            state.form.entries.push({ type: 'ob1', hours: '' });
            render();
          }
          else if (action === 'remove-entry') {
            state.form.entries.splice(idx, 1);
            render();
          }
          else if (action === 'toggle-perdiem') {
            state.form.perDiem = !state.form.perDiem;
            render();
          }
          else if (action === 'save-report') saveReport();
          else if (action === 'clear-data') {
            if (confirm('Rensa all sparad data?')) {
              state.data = { reports: [], projects: defaultProjects };
              saveData(state.data);
              render();
            }
          }
        });
      });

      // Inputs that need live update without full re-render sometimes
      const projectSelect = document.getElementById('project-select');
      if (projectSelect) {
        projectSelect.addEventListener('change', (e) => {
          state.form.projectId = e.target.value;
        });
      }

      document.querySelectorAll('[data-action="set-hours"]').forEach(input => {
        input.addEventListener('input', (e) => {
          const i = parseInt(e.target.dataset.idx);
          state.form.entries[i].hours = e.target.value;
        });
      });

      const mileage = document.getElementById('mileage-input');
      if (mileage) mileage.addEventListener('input', e => state.form.mileage = e.target.value);

      const comment = document.getElementById('comment-input');
      if (comment) comment.addEventListener('input', e => state.form.comment = e.target.value);
    }

    function saveReport() {
      const f = state.form;
      if (!f.projectId) {
        alert('Välj ett projekt först');
        return;
      }
      const validEntries = f.entries.filter(e => parseFloat(e.hours) > 0);
      if (validEntries.length === 0) {
        alert('Ange minst en tid med timmar');
        return;
      }

      const report = {
        id: Date.now().toString(),
        date: state.selectedDate,
        projectId: f.projectId,
        entries: validEntries.map(e => ({ type: e.type, hours: parseFloat(e.hours) })),
        mileage: f.mileage ? parseFloat(f.mileage) : null,
        perDiem: f.perDiem,
        comment: f.comment || '',
        createdAt: new Date().toISOString()
      };

      state.data.reports.push(report);
      saveData(state.data);
      state.view = 'home';
      render();
    }

    // Start
    render();
  </script>
</body>
</html>
